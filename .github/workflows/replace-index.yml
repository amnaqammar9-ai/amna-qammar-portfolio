name: Replace index.html with updated version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Replace index.html with the updated version
        run: |
          mv index_updated.html index.html
          git config user.name "amnaqammar9-ai"
          git config user.email "amnaqammar9-ai@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with tabbed cleaning viewer (multi-viewer JS)"
          git push
